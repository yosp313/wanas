name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: wanas, POSTGRES_PASSWORD: wanas_local, POSTGRES_DB: wanas }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wanas -d wanas"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run db:migrate
        env: { DATABASE_URL: postgres://wanas:wanas_local@localhost:5432/wanas }
      - run: npm run test
        env: { DATABASE_URL: postgres://wanas:wanas_local@localhost:5432/wanas }
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      - name: Run Clerk browser smoke tests
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
        if: ${{ env.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY != '' && env.CLERK_SECRET_KEY != '' }}
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
